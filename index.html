<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>A Fatec Com Piso</title>
  <style>
    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #172632;
      color: #fff;
      font-family: "Segoe UI", Arial, sans-serif
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%
    }

    .panel {
      position: fixed;
      padding: 10px 14px;
      border-radius: 12px;
      background: #142130eb;
      border: 1px solid #ffffff25;
      box-shadow: 0 4px 20px #0003;
      pointer-events: none
    }

    #title {
      top: 14px;
      left: 14px
    }

    #title strong {
      display: block;
      font-size: 17px
    }

    #location {
      font-size: 11px;
      color: #b7cbd6
    }

    #controls {
      left: 14px;
      bottom: 14px;
      font-size: 12px;
      line-height: 1.6
    }

    #hint {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 18px;
      border-radius: 10px;
      background: #152c40ed;
      color: #f5dc9a;
      pointer-events: none;
      display: none;
      text-align: center
    }

    @media(max-width:600px) {
      #controls {
        font-size: 10px
      }
    }
  </style>
</head>

<body>
  <canvas id="canvas"></canvas>
  <div class="panel" id="title">
    <strong>A Fatec Com Piso</strong>
    <span id="location">Cidade</span>
  </div>

  <div id="hint"></div>

  <script>
    "use strict";

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const locationText = document.getElementById("location");
    const hint = document.getElementById("hint");

    const WORLD = { w: 5600, h: 4900 };
    const INTERIOR = { w: 2600, h: 1900 };

    const VX = [
      420, 870, 1320, 1770, 2220, 2670,

    const HY = [1380, 1790, 2200, 2610, 3020, 3430, 3840];

    const FATEC = {

      type: "fatec", solid: true
    };

    const CAMPUS = { x: 1980, y: 300, w: 1640, h: 900 };
    const ENTRY = { x: 2800, y: 965 };
    const EXIT = { x: 860, y: 1845 };
    const INDOOR_SPAWN = { x: 860, y: 1750 };

    const ESPELINHOS = {
      x: 3650, y: 1050, w: 300, h: 190,
      type: "espetinhos", solid: true
    };

    const RAINBOW = [
      "#e40303", "#ff8c00", "#ffed00",
      "#008026", "#24408e", "#732982"
    ];

    const LIGHT_SKIN = "#efd0b1";
    const skins = [
      "#e8b98d", "#c98b63", "#8d5a3b", "#6b432b"
    ];
    const shirts = [
      "#c85a5a", "#4f7ea8", "#5f8d5a",
      "#b98b4a", "#7a5f9c", "#5a8b8b"
    ];
    const hairs = [
      "#2b2118", "#5c3a22", "#b08b50", "#34343d"
    ];

    const player = {
      name: "Player", x: 2800, y: 1250, radius: 11,
      speed: 235, shirt: "#367f91",
      skin: "#d6a680", hair: "#49352c",
      step: 0, walking: false, facing: "down"
    };

    const keys = new Set();
    const camera = { x: 0, y: 0 };

    const buildings = [], parks = [], walls = [], trees = [];
    const people = [], beachPeople = [], vehicles = [], animals = [];
    const snakes = [], students = [], jeanStudents = [];
    const customers = [];
    const rooms = [], insideWalls = [], furniture = [], cracks = [];

    let felipe, zannetu, linux, evangelista, joao, wagner, nicolas;
    let jean, psicologa, tia;

    let inside = false, width = 1, height = 1, dpr = 1;
    let lastTime = 0, time = 0, interactRequested = false;
    let studentTimer = 2, lastStudent = -1;

    const PHRASES = {
      felipe: [
        "Eu sou o Felipe e sou gay.",

      ],
      zannetu: [
        "Python é um lixo.",
        "Eu amo o Texas.",

      ],
      evangelista: [

      ],
      joao: [

        "Venha cá, Tkinter.",

      alunos: [

      ],
      jean: [
        "Hahaha... tentem me acompanhar!",
        "Java, Java, Javaaaa!",
        "Eu sou mau! Hahaha!",
        "Eu sou mais rápido que meus alunos! Haha!"
      ],
      psicologa: [
        "Mindset.",
        "A frequência das coisas boas.",
        "Eu amo Pablo Marçal.",
        "O magnetismo emocional."
      ]
    };

    const rand = (a, b) => a + Math.random() * (b - a);
    const pick = a => a[Math.floor(Math.random() * a.length)];
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const distance = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

    function rect(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x, y, w, h);
    }
    function round(x, y, w, h, r, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
      ctx.fill();
    }
    function oval(x, y, rx, ry, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    function line(x1, y1, x2, y2, color, w = 1) {
      ctx.strokeStyle = color;
      ctx.lineWidth = w;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
    }
    function poly(points, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      points.forEach((p, i) =>
        i ? ctx.lineTo(...p) : ctx.moveTo(...p)
      );
      ctx.closePath();
      ctx.fill();
    }
    function text(
      value, x, y, size = 13, color = "#fff", weight = 600
    ) {
      ctx.save();
      ctx.font = `${weight} ${size}px "Segoe UI",Arial`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = color;
      ctx.fillText(value, x, y);
      ctx.restore();
    }
    function visible(x, y, m = 120) {
      return x > camera.x - m && x < camera.x + width + m &&
        y > camera.y - m && y < camera.y + height + m;
    }
    function visibleBox(b) {
      return b.x + b.w > camera.x - 120 &&
        b.x < camera.x + width + 120 &&
        b.y + b.h > camera.y - 160 &&
        b.y < camera.y + height + 160;
    }
    function intersects(x, y, r, b) {
      return x + r > b.x && x - r < b.x + b.w &&
        y + r > b.y && y - r < b.y + b.h;
    }
    function inCampus(x, y, pad = 0) {
      return x > CAMPUS.x - pad &&
        x < CAMPUS.x + CAMPUS.w + pad &&
        y > CAMPUS.y - pad &&
        y < CAMPUS.y + CAMPUS.h + pad;
    }
    function blockedOutside(x, y, r = 11) {
      return x < r || x > WORLD.w - r || y < SEA_TOP + r || y > WORLD.h - r ||
        walls.some(b => intersects(x, y, r, b)) ||
        buildings.some(b => b.solid && intersects(x, y, r, b));
    }
    function blockedInside(x, y, r = 11) {
      return x < 30 + r || x > INTERIOR.w - 30 - r ||
        y < 30 + r || y > INTERIOR.h - 30 - r ||
        insideWalls.some(b => intersects(x, y, r, b)) ||
        furniture.some(b => b.solid && intersects(x, y, r, b));
    }
    function addWall(x, y, w, h) {
      insideWalls.push({ x, y, w, h });
    }
    function prop(type, x, y, w, h, extra = {}) {
      const p = { type, x, y, w, h, solid: true, ...extra };
      furniture.push(p);
      return p;
    }

    /* ================= CIDADE ================= */

    function createCity() {
      const types = [
        "tower", "shop", "park", "factory", "apartment",
        "hospital", "temple", "cafe", "greenhouse", "cinema",
        "hotel", "stadium", "lighthouse", "library", "windmill",
        "mall", "watertower", "school", "radio", "restaurant",
        "castle", "dome", "police", "fire", "museum",
        "station", "aquarium"
      ];

      const xs = [0, ...VX.map(x => x + ROAD)];
      const xe = [...VX, WORLD.w];
      const ys = [1280, ...HY.map(y => y + ROAD)];
      const ye = [...HY, 4050];
      let index = 0;

      ys.forEach((y, row) => {
        const h = ye[row] - y;

        if (h < 170) return;

        xs.forEach((x, col) => {
          const w = xe[col] - x;
          const type = types[index % types.length];

          const bw = Math.min(
            w - 80,
            ["shop", "cafe"].includes(type) ? 220 : 330
          );
          const bh = Math.min(h - 80, 240);

          const b = {
            x: x + (w - bw) / 2,
            y: y + (h - bh) / 2,
            w: bw, h: bh, type,
            solid: !["park", "stadium"].includes(type),
            variant: index++
          };

          buildings.push(b);

          if (type === "park") parks.push(b);
        });
      });

      buildings.push(FATEC);
      buildings.push(ESPELINHOS);

      const cx = 2800, gap = 200;

      for (const y of [300, 1184]) {
        walls.push({
          x: 1980, y, w: cx - gap / 2 - 1980, h: 16
        });
        walls.push({
          x: cx + gap / 2, y, w: 3620 - cx - gap / 2, h: 16
        });
      }

      walls.push({ x: 1980, y: 300, w: 16, h: 900 });
      walls.push({ x: 3604, y: 300, w: 16, h: 900 });

      for (let i = 0; i < 230; i++) {
        trees.push({
          x: rand(30, 5570),
          y: rand(4110, 4860),
          s: rand(22, 40)
        });
      }
    }

    /* ================= INTERIOR ================= */

    function buildRoomWalls(r) {
      const thick = 16, gap = 120;
      const mx = r.x + r.w / 2;
      const my = r.y + r.h / 2;

      for (const y of [r.y, r.y + r.h - thick]) {
        addWall(r.x, y, mx - gap / 2 - r.x, thick);
        addWall(
          mx + gap / 2, y,
          r.x + r.w - mx - gap / 2, thick
        );
      }

      for (const x of [r.x, r.x + r.w - thick]) {
        addWall(x, r.y, thick, my - gap / 2 - r.y);
        addWall(
          x, my + gap / 2,
          thick, r.y + r.h - my - gap / 2
        );
      }
    }

    function createInterior() {
      const layout = [
        ["class", "class", "lab"],
        ["lab", "patio", "lab"],
        ["class", "auditorium", "lab"]
      ];

      let classroom = 0, lab = 0;

      for (let row = 0; row < 3; row++) {
        for (let col = 0; col < 3; col++) {
          const type = layout[row][col];

          const r = {
            x: 60 + col * 880,
            y: 60 + row * 640,
            w: 720, h: 500, type,
            name: type === "class" ?
              `Sala ${++classroom}` :
              type === "lab" ?
                `Informática ${++lab}` :
                type === "patio" ?
                  "Pátio" : "Auditório"
          };

          rooms.push(r);
          buildRoomWalls(r);

          if (type === "class" || type === "lab") {
            for (const dy of [130, 340]) {
              for (const dx of [90, 480]) {
                prop(
                  type === "lab" ? "computer" : "desk",
                  r.x + dx, r.y + dy, 145, 60,
                  { room: r }
                );
              }
            }

            prop(
              "teacher", r.x + 80, r.y + 55, 145, 60,
              { room: r }
            );
            prop(
              "bin", r.x + r.w - 48, r.y + r.h - 55, 20, 25
            );
          }

          if (type === "auditorium") {
            prop(
              "stage", r.x + 120, r.y + 45, 480, 90,
              { solid: false }
            );

            for (const dy of [180, 290, 400]) {
              for (const dx of [
                70, 150, 230, 435, 515, 595
              ]) {
                prop(
                  "seat", r.x + dx, r.y + dy, 52, 36
                );
              }
            }
          }

          if (type === "patio") {
            for (const dx of [90, 470]) {
              for (const dy of [110, 330]) {
                prop(
                  "planter", r.x + dx, r.y + dy, 150, 65
                );
              }
            }

            prop("bench", r.x + 95, r.y + 205, 115, 20);
            prop("bench", r.x + 510, r.y + 205, 115, 20);
          }
        }
      }

      for (let i = 0; i < 260; i++) {
        cracks.push({
          x: rand(45, 2550),
          y: rand(45, 1850),
          s: rand(15, 38),
          seed: rand(0, 1)
        });
      }

      for (const y of [605, 1245]) {
        prop("water", 45, y, 42, 35);
        prop("notice", 2480, y, 70, 35);
      }
    }

    /* ================= ROTAS ================= */

    function setCircuit(p, points) {
      p.route = points;
      p.index = Math.floor(Math.random() * points.length);
      p.x = points[p.index].x;
      p.y = points[p.index].y;
      p.target = (p.index + 1) % points.length;
      p.step = p.step || 0;
    }

    function followCircuit(p, dt) {
      let remaining = p.speed * dt;

      for (let guard = 0; remaining > 0 && guard < 100; guard++) {
        const t = p.route[p.target];
        const dx = t.x - p.x, dy = t.y - p.y;
        const d = Math.hypot(dx, dy);

        if (d < .001) {
          p.target = (p.target + 1) % p.route.length;
          continue;
        }

        p.angle = Math.atan2(dy, dx);
        const step = Math.min(d, remaining);

        p.x += dx / d * step;
        p.y += dy / d * step;
        remaining -= step;

        if (step >= d) {
          p.target = (p.target + 1) % p.route.length;
        }
      }

      p.step += dt * 9;
    }

    function rectangleRoute(l, t, r, b) {
      return [
        { x: l, y: t }, { x: r, y: t },
        { x: r, y: b }, { x: l, y: b }
      ];
    }

    function gridPoint(c, r) {
      return { x: VX[c] + 50, y: HY[r] + 50 };
    }

    function spawnTraveler(p) {
      p.col = Math.floor(rand(0, VX.length));
      p.row = Math.floor(rand(0, HY.length));

      Object.assign(p, gridPoint(p.col, p.row));
      p.previous = null;

      chooseGridTarget(p);
    }

    function chooseGridTarget(p) {
      const options = [];

      for (const [dc, dr] of [
        [1, 0], [-1, 0], [0, 1], [0, -1]
      ]) {
        const c = p.col + dc;
        const r = p.row + dr;

        if (
          c >= 0 && c < VX.length &&
          r >= 0 && r < HY.length
        ) {
          options.push({ c, r });
        }
      }

      const filtered = options.filter(o =>
        !p.previous ||
        o.c !== p.previous.c ||
        o.r !== p.previous.r
      );

      const next = pick(
        filtered.length ? filtered : options
      );

      p.nextCol = next.c;
      p.nextRow = next.r;
      p.destination = gridPoint(next.c, next.r);
    }

    function moveTraveler(p, dt) {
      let remaining = p.speed * dt;

      for (let guard = 0; remaining > 0 && guard < 50; guard++) {
        const dx = p.destination.x - p.x;
        const dy = p.destination.y - p.y;
        const d = Math.hypot(dx, dy);

        if (d < .001) {
          p.previous = { c: p.col, r: p.row };
          p.col = p.nextCol;
          p.row = p.nextRow;
          chooseGridTarget(p);
          continue;
        }

        p.angle = Math.atan2(dy, dx);
        const step = Math.min(d, remaining);

        p.x += dx / d * step;
        p.y += dy / d * step;
        remaining -= step;
      }

      p.step += dt * 9;
    }

    function nicolasRoute() {
      const path = [];

      for (let row = 0; row < HY.length; row++) {
        const cols = Array.from(
          { length: VX.length }, (_, i) => i
        );

        if (row % 2) cols.reverse();

        cols.forEach(col =>
          path.push(gridPoint(col, row))
        );
      }

      return [
        ...path,
        ...path.slice(1, -1).reverse()
      ];
    }

    /* ================= PERSONAGENS ================= */

    function appearance() {
      return {
        skin: pick(skins),
        hair: pick(hairs),
        shirt: pick(shirts),
        step: 0
      };
    }

    function speaker(name, key, extra = {}) {
      return {
        name, key, speech: "",
        speechTimer: 0,
        nextSpeech: rand(2, 7),
        lastPhrase: -1,
        ...appearance(),
        ...extra
      };
    }

    function createPeople() {
      for (let i = 0; i < 90; i++) {
        const c = Math.floor(rand(0, VX.length - 1));
        const r = Math.floor(rand(0, HY.length - 1));

        const p = {
          ...appearance(),
          speed: rand(24, 40)
        };

        const route = rectangleRoute(
          VX[c] + 117, HY[r] + 117,
          VX[c + 1] - 17, HY[r + 1] - 17
        );

        if (Math.random() < .5) route.reverse();

        setCircuit(p, route);
        people.push(p);
      }

      felipe = speaker("FelipeGay", "felipe", {
        special: true, speed: 43,
        skin: LIGHT_SKIN
      });

      zannetu = speaker("Zannetu", "zannetu", {
        professor: true, speed: 38,
        shirt: "#34414e", hair: "#45413e",
        skin: LIGHT_SKIN
      });

      spawnTraveler(felipe);
      spawnTraveler(zannetu);

      zannetu.trail = [
        { x: zannetu.x, y: zannetu.y }
      ];

      linux = {
        name: "linux",
        x: zannetu.x, y: zannetu.y, step: 0
      };

      evangelista = speaker(
        "Evangelista", "evangelista", {
        professor: true, tired: true, speed: 31,
        shirt: "#4d555d", skin: LIGHT_SKIN
      }
      );

      setCircuit(
        evangelista,
        rectangleRoute(2040, 365, 3560, 1100)
      );

      joao = speaker("João Paulo", "joao", {
        x: rand(400, 5100),
        y: rand(4400, 4650),
        casual: true, stationary: true,
        shirt: "#6d8f5a", skin: LIGHT_SKIN
      });

      for (let i = trees.length - 1; i >= 0; i--) {
        if (distance(trees[i], joao) < 150) {
          trees.splice(i, 1);
        }
      }

      for (let i = 0; i < 12; i++) {
        const a = i * Math.PI * 2 / 12;
        const r = rand(48, 100);

        snakes.push({
          x: joao.x + Math.cos(a) * r,
          y: joao.y + Math.sin(a) * r * .65,
          angle: rand(0, Math.PI * 2),
          length: rand(30, 60),
          phase: rand(0, 6),
          color: pick([
            "#4d713c", "#87753f", "#5c8962"
          ])
        });
      }

      wagner = {
        name: '"professor" Wagner',
        x: WORLD.w - 310, y: 670,
        skin: "#71462f",
        hair: "#211b18",
        shirt: "#8b6476",
        stationary: true, step: 0
      };

      for (let i = 0; i < 16; i++) {
        const a = i * Math.PI * 2 / 16;
        const r = i % 2 ? 220 : 245;

        students.push(speaker("", "alunos", {
          x: wagner.x + Math.cos(a) * r,
          y: wagner.y + Math.sin(a) * r * .85,
          angry: true, stationary: true,
          studentIndex: i
        }));
      }

      nicolas = {
        name: "Nicolas",
        kind: "bike", speed: 430,
        color: "#df7050",
        skin: LIGHT_SKIN,
        shirt: "#365db0",
        step: 0
      };

      setCircuit(nicolas, nicolasRoute());

      for (let i = 0; i < 55; i++) {
        let x, y;

        do {
          x = rand(50, 5550);
          y = rand(280, 1160);
        } while (inCampus(x, y, 40));

        beachPeople.push({
          ...appearance(),
          x, y, beach: true,
          outfit: i % 3, hat: i % 5 === 0,
          swim: pick([
            "#d86d74", "#4b9fc8",
            "#51a08a", "#e3b74c"
          ]),
          speed: rand(16, 27),
          angle: rand(0, 6.28),
          turn: rand(1, 4),
          pause: rand(0, 2),
          walking: false
        });
      }
    }

    function createIndoorCharacters() {
      const lab = rooms.find(r => r.type === "lab");
      const teacherDesk = furniture.find(p =>
        p.type === "teacher" && p.room === lab
      );

      teacherDesk.type = "computer";

      jean = speaker('"professor" Jean', "jean", {
        x: teacherDesk.x + teacherDesk.w / 2,
        y: teacherDesk.y - 5,
        skin: "#b74a45",
        hair: "#241b27",
        shirt: "#252c3c",
        stationary: true,
        demon: true,
        nextSpeech: 2
      });

      furniture.filter(p =>
        p.type === "computer" &&
        p.room === lab &&
        p !== teacherDesk
      ).forEach(desk => {
        for (let i = 0; i < 3; i++) {
          jeanStudents.push({
            ...appearance(),
            x: desk.x + 24 + i * 48,
            y: desk.y + desk.h + 27,
            stationary: true,
            sad: true
          });
        }
      });

      const auditorium = rooms.find(r =>
        r.type === "auditorium"
      );

      psicologa = speaker("Psicóloga", "psicologa", {
        x: auditorium.x + auditorium.w / 2,
        y: auditorium.y + 95,
        skin: "#e7bb9c",
        hair: "#53382d",
        shirt: "#b48ba9",
        stationary: true,
        psychologist: true,
        nextSpeech: 3

    function updateSpeech(p, dt) {
      if (p.speechTimer > 0) {
        p.speechTimer -= dt;

        if (p.speechTimer <= 0) p.speech = "";
        return;
      }

      p.nextSpeech -= dt;

      if (p.nextSpeech > 0) return;

      const list = PHRASES[p.key];
      let i;

      do {
        i = Math.floor(rand(0, list.length));
      } while (
        i === p.lastPhrase && list.length > 1
      );

      p.lastPhrase = i;
      p.speech = list[i];
      p.speechTimer = 4.5;
      p.nextSpeech = rand(7, 13);
    }

    function updateStudents(dt) {
      students.forEach(p => {
        p.speechTimer = Math.max(
          0, p.speechTimer - dt
        );

        if (!p.speechTimer) p.speech = "";
      });

      studentTimer -= dt;

      if (
        studentTimer > 0 ||
        students.some(p => p.speechTimer > 0)
      ) return;

      let i;

      do {
        i = Math.floor(rand(0, students.length));
      } while (i === lastStudent);

      lastStudent = i;
      const p = students[i];

      p.speech = pick(PHRASES.alunos);
      p.speechTimer = 4;
      studentTimer = 6;
    }

    function updatePenguin(dt) {
      const trail = zannetu.trail;
      const last = trail[trail.length - 1];

      if (distance(last, zannetu) >= 2) {
        trail.push({
          x: zannetu.x, y: zannetu.y
        });
      }

      let remaining = 36;
      let point = trail[0];

      for (let i = trail.length - 1; i > 0; i--) {
        const a = trail[i], b = trail[i - 1];
        const d = distance(a, b);

        if (d >= remaining) {
          const t = remaining / d;

          point = {
            x: a.x + (b.x - a.x) * t,
            y: a.y + (b.y - a.y) * t
          };
          break;
        }

        remaining -= d;
      }

      linux.x = point.x;
      linux.y = point.y;
      linux.step += dt * 10;

      if (trail.length > 150) {
        trail.splice(0, trail.length - 150);
      }
    }

    function updateAnimals(dt) {
      animals.forEach(a => {
        a.turn -= dt;

        if (a.turn <= 0) {
          a.angle += rand(-1.5, 1.5);
          a.turn = rand(1, 4);
        }

        const x = a.x + Math.cos(a.angle) * a.speed * dt;
        const y = a.y + Math.sin(a.angle) * a.speed * dt;
        const z = a.zone;

        if (
          x < z.x + 20 || x > z.x + z.w - 20 ||
          y < z.y + 20 || y > z.y + z.h - 20 ||
          blockedOutside(x, y, 15)
        ) {
          a.angle += 2;
          return;
        }

        a.x = x; a.y = y; a.step += dt * 8;
      });
    }

    function updateBeach(dt) {
      beachPeople.forEach(p => {
        p.walking = false;

        if (p.pause > 0) {
          p.pause -= dt;
          return;
        }

        p.turn -= dt;

        if (p.turn <= 0) {
          p.turn = rand(1, 4);
          p.angle += rand(-1.2, 1.2);

          if (Math.random() < .2) {
            p.pause = rand(1, 3);
            return;
          }
        }

        const x = p.x + Math.cos(p.angle) * p.speed * dt;
        const y = p.y + Math.sin(p.angle) * p.speed * dt;

        if (
          x < 35 || x > 5565 || y < 275 || y > 1190 ||
          inCampus(x, y, 30)
        ) {
          p.angle += 2;
          return;
        }

        p.x = x; p.y = y;
        p.walking = true;
        p.step += dt * 8;
      });
    }

    /* ================= JOGADOR ================= */

    function nearbyDoor() {
      return inside ?
        distance(player, EXIT) < 85 :
        Math.abs(player.x - ENTRY.x) < 100 &&
        Math.abs(player.y - ENTRY.y) < 65;
    }

    function updatePlayer(dt) {
      let dx =
        Number(
          keys.has("d") || keys.has("arrowright")
        ) -
        Number(
          keys.has("a") || keys.has("arrowleft")
        );

      let dy =
        Number(
          keys.has("s") || keys.has("arrowdown")
        ) -
        Number(
          keys.has("w") || keys.has("arrowup")
        );

      const old = { x: player.x, y: player.y };
      if ((dx || dy) && S.drunk > 0) { dx += Math.sin(time * 3) * (S.drunk / 100) * .7; dy += Math.cos(time * 2.7) * (S.drunk / 100) * .5; }

      if (dx || dy) {
        const d = Math.hypot(dx, dy);
        dx /= d; dy /= d;

        player.facing = Math.abs(dx) > Math.abs(dy) ?
          (dx > 0 ? "right" : "left") :
          (dy > 0 ? "down" : "up");

        const total =
          player.speed *
          (keys.has("shift") ? 1.6 : 1) * dt;

        const steps = Math.max(
          1, Math.ceil(total / 3)
        );

        const collision =
          inside ? blockedInside : blockedOutside;

        for (let i = 0; i < steps; i++) {
          const x = player.x + dx * total / steps;

          if (!collision(x, player.y, player.radius)) {
            player.x = x;
          }

          const y = player.y + dy * total / steps;

          if (!collision(player.x, y, player.radius)) {
            player.y = y;
          }
        }
      }

      player.walking = distance(player, old) > .01;
      player.step = player.walking ?
        player.step + dt * 11 : 0;

      if (interactRequested && nearbyDoor()) {
        inside = !inside;

        Object.assign(
          player,
          inside ? INDOOR_SPAWN : ENTRY
        );

        player.facing = inside ? "up" : "down";
        player.walking = false;
        player.step = 0;
      }

      interactRequested = false;

      const near = nearbyDoor();
      hint.style.display = near ? "block" : "none";
      hint.textContent = inside ?
        "Pressione E para sair" :
        "Pressione E para entrar na Fatec";
    }

      ctx.lineCap = "round";
      ctx.lineWidth = 5;
      ctx.strokeStyle = s.color;
      ctx.beginPath();

      for (let i = 0; i <= 14; i++) {
        const x = i * s.length / 14;
        const y = Math.sin(time * 2 + s.phase + i * .5) * 5;

        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);

      ctx.stroke();

      const y = Math.sin(time * 2 + s.phase + 7) * 5;

      oval(s.length, y, 5, 4, s.color);
      oval(s.length + 2, y - 2, 1, 1, "#ecd685");

      ctx.restore();

    function drawFurniture(p) {

    /* ================= NOMES E BALÕES ================= */

    function nametag(p) {
      if (!p.name) return;

      const offset =
        p === wagner ? 185 :
          p === jean ? 78 :
            p === linux ? 43 :
              p === nicolas ? 60 : 57;

      const x = p.x, y = p.y - offset;

      ctx.save();
      ctx.font = '700 13px "Segoe UI",Arial';

      const w = ctx.measureText(p.name).width + 22;

      round(x - w / 2, y - 13, w, 26, 7, "#142232ed");

      if (p.special) {
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(x - w / 2, y - 13, w, 26, 7);
        ctx.clip();

        RAINBOW.forEach((c, i) =>
          rect(x - w / 2 + i * w / 6, y + 9, w / 6 + 1, 4, c)
        );

        ctx.restore();
      }

      text(p.name, x, y, 13);
      ctx.restore();
    }

    function speechBubble(p) {
      if (
        !p.speech || p.speechTimer <= 0 ||
        !visible(p.x, p.y, 0)
      ) return;

      ctx.save();
      ctx.font = '600 13px "Segoe UI",Arial';

      const lines = [];
      let current = "";
      const maxWidth = Math.max(
        90, Math.min(210, width - 40)
      );

      for (const word of p.speech.split(" ")) {
        const test = current ? current + " " + word : word;

        if (
          current &&
          ctx.measureText(test).width > maxWidth
        ) {
          lines.push(current);
          current = word;
        } else {
          current = test;
        }
      }

      if (current) lines.push(current);

      const w = Math.max(
        ...lines.map(s => ctx.measureText(s).width)
      ) + 24;
      const h = lines.length * 18 + 18;
      const student = p.key === "alunos";

      let cx = p.x;

      if (student) {
        cx += p.x < wagner.x ? -100 : 100;
      }

      cx = clamp(
        cx, camera.x + w / 2 + 8,
        camera.x + width - w / 2 - 8
      );

      let bottom = p.y - (p === jean ? 112 : 90);

      if (student && p.y > wagner.y) {
        bottom = p.y + h + 35;
      }

      const top = Math.max(camera.y + 8, bottom - h);

      round(cx - w / 2 + 3, top + 4, w, h, 10, "#0003");
      round(cx - w / 2, top, w, h, 10, "#f7f2e5");

      if (student && p.y > wagner.y) {
        poly([
          [cx - 6, top + 1],
          [cx + 6, top + 1],
          [p.x, p.y + 10]
        ], "#f7f2e5");
      } else {
        poly([
          [cx - 6, top + h - 1],
          [cx + 6, top + h - 1],
          [p.x, p.y - (p === jean ? 94 : 68)]
        ], "#f7f2e5");
      }

      lines.forEach((s, i) =>
        text(s, cx, top + 18 + i * 18, 13, "#2c3c44")
      );

      ctx.restore();
    }

    function gps(
      target, label, color, margin, rainbow = false
    ) {
      const sx = target.x - camera.x;
      const sy = target.y - camera.y;

      if (
        sx > -20 && sx < width + 20 &&
        sy > -20 && sy < height + 45
      ) return;

      const dx = sx - width / 2;
      const dy = sy - height / 2;
      const m = Math.min(margin, width * .3, height * .3);

      const hw = Math.max(1, width / 2 - m);
      const hh = Math.max(1, height / 2 - m);

      const factor = 1 / Math.max(
        Math.abs(dx) / hw, Math.abs(dy) / hh
      );

      const x = width / 2 + dx * factor;
      const y = height / 2 + dy * factor;
      const a = Math.atan2(dy, dx);

      oval(x, y, 25, 25, "#142b3eea");

      if (rainbow) {
        RAINBOW.forEach((c, i) => {
          ctx.beginPath();
          ctx.arc(
            x, y, 23,
            i * Math.PI / 3, (i + 1) * Math.PI / 3
          );
          ctx.strokeStyle = c;
          ctx.lineWidth = 4;
          ctx.stroke();
        });
      } else {
        ctx.beginPath();
        ctx.arc(x, y, 23, 0, Math.PI * 2);
        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.stroke();
      }

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(a);
      poly([[36, 0], [25, -7], [25, 7]], color);
      ctx.restore();

      text(
        label === "Fatec" ? "Fatec" : label[0],
        x, y, label === "Fatec" ? 12 : 19
      );

      const caption = label === "Fatec" ? "" :
        `${label} · ${Math.round(distance(player, target) / 10)
        } m`;

      if (caption) {
        ctx.save();
        ctx.font = '600 11px "Segoe UI",Arial';

        const w = ctx.measureText(caption).width + 16;

        const xx = clamp(
          x - Math.cos(a) * 80,
          w / 2 + 6, width - w / 2 - 6
        );
        const yy = clamp(
          y - Math.sin(a) * 48, 14, height - 14
        );

        round(
          xx - w / 2, yy - 11, w, 22, 6, "#142b3eea"
        );
        text(caption, xx, yy, 11, "#eee1bd");
        ctx.restore();
      }
    }

        if (visible(nicolas.x, nicolas.y)) {
          add(
            nicolas.y + 10,
            () => drawBike(nicolas)
          );
        }

        [
          ...people, ...beachPeople,
          felipe, zannetu, evangelista, joao,
          ...students
        ].forEach(p => {
          if (visible(p.x, p.y)) {
            add(p.y + 8, () => drawHuman(p));
          }
        });

        if (visible(linux.x, linux.y)) {
          add(linux.y + 8, drawPenguin);
        }

        if (visible(wagner.x, wagner.y, 220)) {
          add(wagner.y + 8, drawWagner);
        }

        if (visible(tia.x, tia.y, 180)) {
          add(tia.y + 8, () => drawHuman(tia));
        }

        customers.forEach(p => {
          if (visible(p.x, p.y)) {
            add(p.y + 8, () => drawHuman(p));
          }
        });

        locationText.textContent =
          player.y > 4050 ? "Floresta" :
            player.y < 1280 ?
              (
                inCampus(player.x, player.y) ?
                  "Campus Fatec" :
                  player.x > ESPELINHOS.x - 100 &&
                    player.x < ESPELINHOS.x + ESPELINHOS.w + 100 &&
                    player.y > ESPELINHOS.y - 100 &&
                    player.y < ESPELINHOS.y + ESPELINHOS.h + 100 ?
                    "Espetinhos" : "Praia"
              ) :
              "Cidade";
      }

      add(player.y + 8, () => drawHuman(player));

      items.sort((a, b) => a.y - b.y);
      items.forEach(item => item.draw());

      nametag(player);

      if (inside) {
        [jean, psicologa].forEach(p => {
          if (visible(p.x, p.y, 0)) nametag(p);
          speechBubble(p);
        });
      } else {
        [
          felipe, zannetu, linux,
          evangelista, joao, wagner, nicolas
        ].forEach(p => {
          if (visible(p.x, p.y, 0)) nametag(p);
        });

        if (visible(tia.x, tia.y, 0)) {
          nametag({
            name: "Tia",
            x: tia.x,
            y: tia.y - 30
          });
        }

        [
          felipe, zannetu, evangelista, joao,
          ...students
        ].forEach(speechBubble);
      }

      ctx.restore();

      if (!inside) {
        gps(felipe, "Felipe", "#efd18d", 44, true);
        gps(zannetu, "Zannetu", "#e4bd79", 83);

        const seen =
          FATEC.x + FATEC.w > camera.x &&
          FATEC.x < camera.x + width &&
          FATEC.y + FATEC.h > camera.y &&
          FATEC.y < camera.y + height;

        if (!seen) {
          gps(
            { x: 2800, y: 685 },
            "Fatec", "#8ac9dc", 125
          );
        }
      }
    }

    /* ================= TELA E CONTROLES ================= */

    function resize() {
      width = Math.max(1, window.innerWidth);
      height = Math.max(1, window.innerHeight);
      dpr = Math.min(window.devicePixelRatio || 1, 2);

      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
    }

    window.addEventListener("resize", resize);

    window.addEventListener("keydown", e => {
      const key = e.key.toLowerCase();

      if ([
        "w", "a", "s", "d",
        "arrowup", "arrowdown",
        "arrowleft", "arrowright",
        "shift", "e"
      ].includes(key)) {
        e.preventDefault();
        keys.add(key);
      }

      if (key === "e" && !e.repeat) {
        interactRequested = true;
      }
    });

    window.addEventListener("keyup", e => {
      keys.delete(e.key.toLowerCase());
    });

    function resetInput() {
      keys.clear();
      interactRequested = false;
      lastTime = 0;
    }

    window.addEventListener("blur", resetInput);
    document.addEventListener("visibilitychange", resetInput);

    function loop(timestamp) {
      const dt = lastTime ?
        Math.min((timestamp - lastTime) / 1000, .04) : 0;

      lastTime = timestamp;

      update(dt);
      draw();

      requestAnimationFrame(loop);
    }

      const wasAlive = !character.dead;
      const result = originalDie(character, ...args);
      const source = wasAlive &&
        missionDropSources.find(entry => entry.character === character);
      if (source && !collectedMissionItems.has(source.id) &&
          !loot.some(drop => drop.id === source.id)) {
        drop(source.id, character.x + 25, character.y,
          character.scene || source.scene);
      }
      return result;
    };

    const originalCollect = collect;
    collect = function () {
      const found = nearestLoot();
      if (!found || !missionItemIds.has(found.id)) return originalCollect();
      loot.splice(loot.indexOf(found), 1);
      collectedMissionItems.add(found.id);
      sound.play('pickup');
      if (found.id === 'computer') {
        tell('Computador obtido: coleção desbloqueada.');
        for (const item of missionItems) activateMissionPower(item.id);
      } else {
        activateMissionPower(found.id);
      }
      if (collectedMissionItems.size === missionItems.length &&
          !missionRewardClaimed) {
        missionRewardClaimed = true;
        S.money += 500;
        sound.play('coin');
        tell('Coleção completa! Você recebeu R$ 500.');
      } else {
        tell(`${goods[found.id].name} adicionado à coleção.`);
      }
      if (collectionPanel.style.display === 'block') renderMissionCollection();
      return true;
    };

    function activateMissionPower(id) {
      if (!collectedMissionItems.has('computer') ||
          !collectedMissionItems.has(id) ||
          activatedMissionPowers.has(id) || id === 'computer') return;
      activatedMissionPowers.add(id);
      if (id === 'magnetUsb') {
        player.maxHp += 50;
        player.hp = Math.min(player.maxHp, player.hp + 50);
      } else if (id === 'speedUsb') {
        player.speed += 60;
      } else if (id === 'noBreakUsb') {
        tell('Poder ativo: a fome diminui mais devagar.');

        while (bag.length < 20) bag.push(null);

    };

    const originalUseItem = useItem;
    useItem = function (index) {
      const entry = bag[index];
      if (entry?.id === 'dildo') return false;
      const food = goods[entry?.id];
      if (entry?.id === 'medkit') {
        if (S.dead || S.blackout > 0) return false;
        if (player.hp >= player.maxHp) {
          tell('Vida já está cheia.');
          return false;
        }
        player.hp = Math.min(player.maxHp, player.hp + 45);
        bag[index] = null;
        sound.play('eat');
        refresh();
        return true;
      }
      if (entry && food?.food) {
        if (player.hp >= player.maxHp && S.hunger >= 100) {
          tell('Vida e fome já estão completas.');
          return false;
        }
        player.hp = Math.min(player.maxHp, player.hp + (food.heal || 0));
        S.hunger = Math.min(100, S.hunger + food.food);
        bag[index] = null;
        sound.play('eat');
        refresh();
        return true;
      }
      return originalUseItem(index);
    };

    hospitalHeal = function () {
      if (player.hp >= player.maxHp) {
        tell('Vida já está cheia');
        return;
      }
      if (S.money < 25) {
        tell('Tratamento: R$ 25');
        return;
      }
      S.money -= 25;
      player.hp = player.maxHp;
      sound.play('buy');
      tell('Vida restaurada');
    };

    const originalAttack = attack;
    attack = function () {
      if (held() !== 'dildo') return originalAttack();
      if (S.dead || S.vehicle || player.swimming ||
          S.blackout > 0 || S.cool > 0 || S.reload > 0) return;
      S.cool = .5;
      S.attack = .3;
      S.hand = S.next;
      S.next *= -1;
      const direction = facing();
      const target = targets().filter(p => !p.dead && !p.inCar &&
        p !== missionPenguin &&
        distance(p, player) < goods.dildo.range &&
        (p.x - player.x) * Math.cos(direction) +
        (p.y - player.y) * Math.sin(direction) > -10)
        .sort((a, b) => distance(a, player) - distance(b, player))[0];
      if (target) {
        vital(target);
        if (dildoCharged) {
          target.hp = Math.max(1, target.hp / 2);
          dildoCharged = false;
          tell('Golpe especial: metade da vida do alvo!');
        } else {
          hurt(target, goods.dildo.damage);
        }
        crime('assault', target);
      }
      sound.play('punch');
    };

    const originalUpdateWithMissions = update;
    update = function (dt) {
      const running = !S.dead && !S.blackout && !panelMode && !mapOpen;
      if (running) {
        S.clock += dt * 4;
        if (S.clock >= 24 * 60) {
          S.clock -= 24 * 60;
          S.day++;
        }
        const hungerDrain = dt * .04 *
          (activatedMissionPowers.has('noBreakUsb') ? .5 : 1);
        S.hunger = Math.max(0, S.hunger - hungerDrain);
      }
      originalUpdateWithMissions(dt);
      if (running && missionPenguin && !missionPenguin.dead &&
          missionPenguin.scene === place()) {
        const target = officers.find(person =>
          person.hostile && !person.dead && !person.inCar &&
          person.scene === place() &&
          distance(person, missionPenguin) < 200
        );
        if (target) {
          const angle = Math.atan2(
            target.y - missionPenguin.y,
            target.x - missionPenguin.x
          );
          const nx = missionPenguin.x + Math.cos(angle) * 140 * dt;
          const ny = missionPenguin.y + Math.sin(angle) * 140 * dt;
          if (!blocked(nx, ny, 10, place())) {
            missionPenguin.x = nx;
            missionPenguin.y = ny;
            missionPenguin.step += dt * 10;
          }
          missionPenguin.petAttackCooldown -= dt;
          if (distance(missionPenguin, target) < 30 &&
              missionPenguin.petAttackCooldown <= 0) {
            hurt(target, 12, missionPenguin);
            missionPenguin.petAttackCooldown = 1;
          }
        } else {
          const distanceToPlayer = distance(missionPenguin, player);
          if (distanceToPlayer > 55) {
            const angle = Math.atan2(
              player.y - missionPenguin.y, player.x - missionPenguin.x
            );
            const nx = missionPenguin.x + Math.cos(angle) * 120 * dt;
            const ny = missionPenguin.y + Math.sin(angle) * 120 * dt;
            if (!blocked(nx, ny, 10, place())) {
              missionPenguin.x = nx;
              missionPenguin.y = ny;
              missionPenguin.step += dt * 8;
            }
          }
        }
      }
    };

    function nightOpacity() {
      const hour = S.clock / 60;
      if (hour >= 7 && hour < 17.5) return 0;
      if (hour >= 17.5 && hour < 19) return (hour - 17.5) / 1.5 * .67;
      if (hour >= 5.5 && hour < 7) return (7 - hour) / 1.5 * .67;
      return .67;
    }

    const nightCanvas = document.createElement('canvas');
    function drawNightOverlay() {
      const opacity = nightOpacity();
      if (!opacity || place() !== 'world') return;
      if (nightCanvas.width !== canvas.width) nightCanvas.width = canvas.width;
      if (nightCanvas.height !== canvas.height) nightCanvas.height = canvas.height;
      const nightContext = nightCanvas.getContext('2d');
      nightContext.setTransform(dpr, 0, 0, dpr, 0, 0);
      nightContext.clearRect(0, 0, width, height);
      nightContext.globalCompositeOperation = 'source-over';
      nightContext.fillStyle = `rgba(8,17,42,${opacity})`;
      nightContext.fillRect(0, 0, width, height);
      nightContext.globalCompositeOperation = 'destination-out';
      const light = (x, y, radius, strength) => {
        const gradient = nightContext.createRadialGradient(x, y, 2, x, y, radius);
        gradient.addColorStop(0, `rgba(0,0,0,${strength})`);
        gradient.addColorStop(1, 'rgba(0,0,0,0)');
        nightContext.fillStyle = gradient;
        nightContext.fillRect(x - radius, y - radius, radius * 2, radius * 2);
      };
      light(player.x - camera.x, player.y - camera.y - 15, 145, .48);
      for (const x of VX) {
        for (const y of HY) {
          const sx = x - camera.x, sy = y - camera.y;
          if (sx > -120 && sx < width + 120 &&
              sy > -120 && sy < height + 120) {
            light(sx, sy, 115, .76);
          }
        }
      }
      if (S.vehicle) {
        const angle = S.vehicle.angle || 0;
        light(
          player.x - camera.x + Math.cos(angle) * 120,
          player.y - camera.y + Math.sin(angle) * 120,
          165, .84
        );
      }
      nightContext.globalCompositeOperation = 'source-over';
      ctx.save();
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.drawImage(nightCanvas, 0, 0, canvas.width, canvas.height,
        0, 0, width, height);
      ctx.restore();
    }

    const originalHUD = HUD;
    HUD = function () {
      drawNightOverlay();
      originalHUD();
      round(width / 2 - 91, 69, 182, 34, 12, '#102536ee');
      const hour = Math.floor(S.clock / 60);
      const minute = Math.floor(S.clock % 60);
      text(
        `${hour >= 19 || hour < 6 ? '☾' : '☀'} ` +
        `${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')} · DIA ${S.day}`,
        width / 2, 86, 13, '#e7d9b7'
      );
      const hungerY = height - 266;
      round(16, hungerY, 170, 30, 8, '#102536ee');
      text(`FOME ${Math.ceil(S.hunger)}%`, 101, hungerY + 10, 11, '#e4d5b1');
      round(28, hungerY + 19, 146, 5, 3, '#4d4431');
      if (S.hunger > 0) {
        round(28, hungerY + 19, 146 * S.hunger / 100, 5, 2,
          S.hunger <= 50 ? '#e5a269' : '#c9af6d');
      }
      if (player.maxHp > 100) {
        const x = 35, y = height - 147, w = Math.min(232, width - 70);
        round(x, y, w, 46, 8, '#102536');
        text(`VIDA ${Math.ceil(player.hp)} / ${player.maxHp}`,
          x + w / 2, y + 12, 12, '#eff9f2');
        round(x + 14, y + 27, w - 28, 10, 5, '#283d48');
        round(x + 14, y + 27, (w - 28) *
          Math.min(1, player.hp / player.maxHp), 10, 5, '#60c9a1');
      }
    };

    const originalItemCanvas = itemCanvas;
    itemCanvas = function (id) {
      if (id !== 'dildo') return originalItemCanvas(id);
      const canvas = document.createElement('canvas');
      canvas.width = 70;
      canvas.height = 55;
      canvas.style.cssText = 'width:58px;height:46px;pointer-events:none';
      const itemContext = canvas.getContext('2d');
      itemContext.translate(35, 28);
      itemContext.fillStyle = '#e86a9a';
      itemContext.beginPath();
      itemContext.ellipse(0, 0, 9, 20, 0, 0, Math.PI * 2);
      itemContext.fill();
      itemContext.fillStyle = '#f7a8c4';
      itemContext.beginPath();
      itemContext.ellipse(0, -14, 6, 6, 0, 0, Math.PI * 2);
      itemContext.fill();
      return canvas;
    };

    const originalIcon = icon;
    icon = function (id, x, y, scale = 1) {
      if (!missionItemIds.has(id) && id !== 'dildo') {
        return originalIcon(id, x, y, scale);
      }
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      if (id === 'dildo') {
        oval(0, 0, 9, 20, '#e86a9a');
        oval(0, -14, 6, 6, '#f7a8c4');
      } else if (id === 'computer') {
        round(-15, -12, 30, 22, 3, '#5b7684');
        rect(-12, -9, 24, 15, '#9fd8e8');
        rect(-6, 12, 12, 3, '#3a4a55');
      } else {
        round(-8, -16, 16, 32, 3, '#4a5a68');
        rect(-5, -12, 10, 8, '#c9d6dd');
        rect(-4, 10, 8, 3, '#84939d');
      }
      ctx.restore();
    };

    drawPenguin = function (penguin = linux) {
      ctx.save();
      ctx.translate(penguin.x, penguin.y);
      const step = Math.sin(penguin.step || 0) * 2;
      oval(0, 6, 10, 4, '#0003');
      oval(-5, 5 + step, 5, 3, '#e3ae4c');
      oval(5, 5 - step, 5, 3, '#e3ae4c');
      oval(0, -8, 9, 13, '#1c2934');
      oval(0, -5, 6, 9, '#efeede');
      oval(0, -20, 8, 8, '#1c2934');
      oval(-3, -20, 3.5, 4, '#efeede');
      oval(3, -20, 3.5, 4, '#efeede');
      oval(-3, -21, 1, 1.5, '#182b38');
      oval(3, -21, 1, 1.5, '#182b38');
      poly([[-3, -17], [3, -17], [0, -13]], '#e2ac46');
      ctx.restore();
    };
    const originalDrawHuman = drawHuman;
    drawHuman = function (person) {
      if (person.petPenguin) return drawPenguin(person);
      originalDrawHuman(person);
    };

    window.addEventListener('keydown', event => {
      if (event.key.toLowerCase() === 'p' && !event.repeat &&
          activatedMissionPowers.has('pyUsb')) {
        summonMissionSnakes();
        event.preventDefault();
      }
    });

    resize();

    requestAnimationFrame(loop);
  </script>
</body>

</html>
