const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

function rect(x,y,w,h,color){
  ctx.fillStyle=color;
  ctx.fillRect(x,y,w,h);
}
function round(x,y,w,h,r,color){
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.roundRect(x,y,w,h,r);
  ctx.fill();
}
function oval(x,y,rx,ry,color){
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);
  ctx.fill();
}
function line(x1,y1,x2,y2,color,w=1){
  ctx.strokeStyle=color;
  ctx.lineWidth=w;
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.lineTo(x2,y2);
  ctx.stroke();
}
function poly(points,color){
  ctx.fillStyle=color;
  ctx.beginPath();
  points.forEach((p,i)=>
    i?ctx.lineTo(...p):ctx.moveTo(...p)
  );
  ctx.closePath();
  ctx.fill();
}
function text(
  value,x,y,size=13,color="#fff",weight=600
){
  ctx.save();
  ctx.font=`${weight} ${size}px "Segoe UI",Arial`;
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillStyle=color;
  ctx.fillText(value,x,y);
  ctx.restore();
}
function visible(x,y,m=120){
  return x>camera.x-m&&x<camera.x+width+m&&
    y>camera.y-m&&y<camera.y+height+m;
}
function visibleBox(b){
  return b.x+b.w>camera.x-120&&
    b.x<camera.x+width+120&&
    b.y+b.h>camera.y-160&&
    b.y<camera.y+height+160;
}
function intersects(x,y,r,b){
  return x+r>b.x&&x-r<b.x+b.w&&
    y+r>b.y&&y-r<b.y+b.h;
}
function inCampus(x,y,pad=0){
  return x>CAMPUS.x-pad&&
    x<CAMPUS.x+CAMPUS.w+pad&&
    y>CAMPUS.y-pad&&
    y<CAMPUS.y+CAMPUS.h+pad;
}
function blockedOutside(x,y,r=11){
  return x<r||x>WORLD.w-r||y<250||y>WORLD.h-r||
    walls.some(b=>intersects(x,y,r,b))||
    buildings.some(b=>b.solid&&intersects(x,y,r,b));
}
function blockedInside(x,y,r=11){

    y<30+r||y>INTERIOR.h-30-r||
    insideWalls.some(b=>intersects(x,y,r,b))||
    furniture.some(b=>b.solid&&intersects(x,y,r,b));
}
function addWall(x,y,w,h){

function prop(type,x,y,w,h,extra={}){

  ys.forEach((y,row)=>{
    const h=ye[row]-y;

    if(h<170)return;

    xs.forEach((x,col)=>{
      const w=xe[col]-x;
      const type=types[index%types.length];

      const bw=Math.min(
        w-80,
        ["shop","cafe"].includes(type)?220:330
      );
      const bh=Math.min(h-80,240);

      const b={
        x:x+(w-bw)/2,
        y:y+(h-bh)/2,
        w:bw,h:bh,type,
        solid:!["park","stadium"].includes(type),
        variant:index++
      };

      buildings.push(b);

      if(type==="park")parks.push(b);
    });

  buildings.push(FATEC);
  buildings.push(ESPELINHOS);

  const cx=2800,gap=200;

    walls.push({

    });

function buildRoomWalls(r){
  const thick=16,gap=120;
  const mx=r.x+r.w/2;
  const my=r.y+r.h/2;

  for(const y of [r.y,r.y+r.h-thick]){
    addWall(r.x,y,mx-gap/2-r.x,thick);
    addWall(
      mx+gap/2,y,
      r.x+r.w-mx-gap/2,thick
    );
  }

  for(const x of [r.x,r.x+r.w-thick]){
    addWall(x,r.y,thick,my-gap/2-r.y);
    addWall(
      x,my+gap/2,
      thick,r.y+r.h-my-gap/2
    );
  }
}

/* ================= ROTAS ================= */

function setCircuit(p,points){
  p.route=points;
  p.index=Math.floor(Math.random()*points.length);
  p.x=points[p.index].x;
  p.y=points[p.index].y;
  p.target=(p.index+1)%points.length;
  p.step=p.step||0;
}

function followCircuit(p,dt){
  let remaining=p.speed*dt;

  for(let guard=0;remaining>0&&guard<100;guard++){
    const t=p.route[p.target];
    const dx=t.x-p.x,dy=t.y-p.y;
    const d=Math.hypot(dx,dy);

    if(d<.001){
      p.target=(p.target+1)%p.route.length;
      continue;
    }

    p.angle=Math.atan2(dy,dx);
    const step=Math.min(d,remaining);

    p.x+=dx/d*step;
    p.y+=dy/d*step;
    remaining-=step;

    if(step>=d){
      p.target=(p.target+1)%p.route.length;
    }
  }

  p.step+=dt*9;
}

function rectangleRoute(l,t,r,b){
  return [
    {x:l,y:t},{x:r,y:t},
    {x:r,y:b},{x:l,y:b}
  ];
}

function gridPoint(c,r){
  return {x:VX[c]+50,y:HY[r]+50};
}

function spawnTraveler(p){
  p.col=Math.floor(rand(0,VX.length));
  p.row=Math.floor(rand(0,HY.length));

  Object.assign(p,gridPoint(p.col,p.row));
  p.previous=null;

  chooseGridTarget(p);
}

function chooseGridTarget(p){
  const options=[];

  for(const [dc,dr] of [
    [1,0],[-1,0],[0,1],[0,-1]
  ]){
    const c=p.col+dc;
    const r=p.row+dr;

    if(
      c>=0&&c<VX.length&&
      r>=0&&r<HY.length
    ){
      options.push({c,r});
    }
  }

  const filtered=options.filter(o=>
    !p.previous||
    o.c!==p.previous.c||
    o.r!==p.previous.r
  );

  const next=pick(
    filtered.length?filtered:options
  );

  p.nextCol=next.c;
  p.nextRow=next.r;
  p.destination=gridPoint(next.c,next.r);
}

function moveTraveler(p,dt){
  let remaining=p.speed*dt;

  for(let guard=0;remaining>0&&guard<50;guard++){
    const dx=p.destination.x-p.x;
    const dy=p.destination.y-p.y;
    const d=Math.hypot(dx,dy);

    if(d<.001){
      p.previous={c:p.col,r:p.row};
      p.col=p.nextCol;
      p.row=p.nextRow;
      chooseGridTarget(p);
      continue;
    }

    p.angle=Math.atan2(dy,dx);
    const step=Math.min(d,remaining);

    p.x+=dx/d*step;
    p.y+=dy/d*step;
    remaining-=step;
  }

  p.step+=dt*9;
}

function nicolasRoute(){
  const path=[];

  for(let row=0;row<HY.length;row++){
    const cols=Array.from(
      {length:VX.length},(_,i)=>i
    );

    if(row%2)cols.reverse();

    cols.forEach(col=>
      path.push(gridPoint(col,row))
    );
  }

  return [
    ...path,
    ...path.slice(1,-1).reverse()
  ];
}

function updateSpeech(p,dt){
  if(p.speechTimer>0){
    p.speechTimer-=dt;

    if(p.speechTimer<=0)p.speech="";
    return;
  }

  p.nextSpeech-=dt;

  if(p.nextSpeech>0)return;

  const list=PHRASES[p.key];
  let i;

  do{
    i=Math.floor(rand(0,list.length));
  }while(
    i===p.lastPhrase&&list.length>1
  );

  p.lastPhrase=i;
  p.speech=list[i];
  p.speechTimer=4.5;
  p.nextSpeech=rand(7,13);
}

function updateStudents(dt){
  students.forEach(p=>{
    p.speechTimer=Math.max(
      0,p.speechTimer-dt
    );

    if(!p.speechTimer)p.speech="";
  });

  studentTimer-=dt;

  if(
    studentTimer>0||
    students.some(p=>p.speechTimer>0)
  )return;

  let i;

  do{
    i=Math.floor(rand(0,students.length));
  }while(i===lastStudent);

  lastStudent=i;
  const p=students[i];

  p.speech=pick(PHRASES.alunos);
  p.speechTimer=4;
  studentTimer=6;
}

function updatePenguin(dt){
  const trail=zannetu.trail;
  const last=trail[trail.length-1];

  if(distance(last,zannetu)>=2){
    trail.push({
      x:zannetu.x,y:zannetu.y
    });
  }

  let remaining=36;
  let point=trail[0];

  for(let i=trail.length-1;i>0;i--){
    const a=trail[i],b=trail[i-1];
    const d=distance(a,b);

    if(d>=remaining){
      const t=remaining/d;

      point={
        x:a.x+(b.x-a.x)*t,
        y:a.y+(b.y-a.y)*t
      };
      break;
    }

    remaining-=d;
  }

  linux.x=point.x;
  linux.y=point.y;
  linux.step+=dt*10;

  if(trail.length>150){
    trail.splice(0,trail.length-150);
  }
}

const animalKinds=[

function createAnimals(){
  for(let i=0;i<125;i++){
    const forest=i>=50;

    const zone=forest?
      {x:25,y:4100,w:5550,h:750}:
      {x:25,y:1280,w:5550,h:2700};

    let x,y;

    for(let k=0;k<100;k++){
      x=rand(zone.x+25,zone.x+zone.w-25);
      y=rand(zone.y+25,zone.y+zone.h-25);

      if(!blockedOutside(x,y,18))break;
    }

    if(blockedOutside(x,y,18))continue;

    animals.push({
      x,y,zone,
      kind:forest?
        pick(animalKinds):
        pick(["dog","cat"]),
      angle:rand(0,6.28),
      speed:rand(18,34),
      turn:rand(1,4),
      step:0,
      color:pick([
        "#a27851","#7e858d",
        "#e5dec9","#655342"
      ])
    });
  }
}

function updateAnimals(dt){
  animals.forEach(a=>{
    a.turn-=dt;

    if(a.turn<=0){
      a.angle+=rand(-1.5,1.5);
      a.turn=rand(1,4);
    }

    const x=a.x+Math.cos(a.angle)*a.speed*dt;
    const y=a.y+Math.sin(a.angle)*a.speed*dt;
    const z=a.zone;

    if(
      x<z.x+20||x>z.x+z.w-20||
      y<z.y+20||y>z.y+z.h-20||
      blockedOutside(x,y,15)
    ){
      a.angle+=2;
      return;
    }

    a.x=x;a.y=y;a.step+=dt*8;
  });
}

function updateBeach(dt){
  beachPeople.forEach(p=>{
    p.walking=false;

    if(p.pause>0){
      p.pause-=dt;
      return;
    }

    p.turn-=dt;

    if(p.turn<=0){
      p.turn=rand(1,4);
      p.angle+=rand(-1.2,1.2);

      if(Math.random()<.2){
        p.pause=rand(1,3);
        return;
      }
    }

    const x=p.x+Math.cos(p.angle)*p.speed*dt;
    const y=p.y+Math.sin(p.angle)*p.speed*dt;

    if(
      x<35||x>5565||y<275||y>1190||
      inCampus(x,y,30)
    ){
      p.angle+=2;
      return;
    }

    p.x=x;p.y=y;
    p.walking=true;
    p.step+=dt*8;
  });
}

/* ================= JOGADOR ================= */

function nearbyDoor(){
  return inside?
    distance(player,EXIT)<85:
    Math.abs(player.x-ENTRY.x)<100&&
    Math.abs(player.y-ENTRY.y)<65;
}

function updatePlayer(dt){
  let dx=
    Number(
      keys.has("d")||keys.has("arrowright")
    )-
    Number(
      keys.has("a")||keys.has("arrowleft")
    );

  let dy=
    Number(
      keys.has("s")||keys.has("arrowdown")
    )-
    Number(
      keys.has("w")||keys.has("arrowup")
    );

  const old={x:player.x,y:player.y};

  if(dx||dy){
    const d=Math.hypot(dx,dy);
    dx/=d;dy/=d;

    player.facing=Math.abs(dx)>Math.abs(dy)?
      (dx>0?"right":"left"):
      (dy>0?"down":"up");

    const total=
      player.speed*
      (keys.has("shift")?1.6:1)*dt;

    const steps=Math.max(
      1,Math.ceil(total/3)
    );

    const collision=
      inside?blockedInside:blockedOutside;

    for(let i=0;i<steps;i++){
      const x=player.x+dx*total/steps;

      if(!collision(x,player.y,player.radius)){
        player.x=x;
      }

      const y=player.y+dy*total/steps;

      if(!collision(player.x,y,player.radius)){
        player.y=y;
      }
    }
  }

  player.walking=distance(player,old)>.01;
  player.step=player.walking?
    player.step+dt*11:0;

  if(interactRequested&&nearbyDoor()){
    inside=!inside;

    Object.assign(
      player,
      inside?INDOOR_SPAWN:ENTRY
    );

    player.facing=inside?"up":"down";
    player.walking=false;
    player.step=0;
  }

  interactRequested=false;

  const near=nearbyDoor();
  hint.style.display=near?"block":"none";
  hint.textContent=inside?
    "Pressione E para sair":
    "Pressione E para entrar na Fatec";
}

function drawHuman(p){
  const moving=
    !p.stationary&&(!p.beach||p.walking);

  const swing=moving?Math.sin(p.step||0)*2.5:0;
  const isPlayer=p===player;

  ctx.save();
  ctx.translate(p.x,p.y);

  if(!isPlayer)ctx.scale(.86,.86);

  oval(2,7,12,5,"#162d3240");

  const pants=
    p.beach?p.skin:
    p.casual?"#456a95":
    p.psychologist?"#66506f":
    p.vendor?"#4a3b2e":"#354655";

  rect(-8,-2+swing,6,11,pants);
  rect(2,-2-swing,6,11,pants);

  rect(
    -9,7+swing,8,4,
    p.beach?p.swim:"#27343c"

    1,7-swing,8,4,
    p.beach?p.swim:"#27343c"

  if(p.beach){
    rect(-10,-24,20,25,p.skin);

    if(p.outfit===0){
      rect(-10,-7,20,9,p.swim);

      rect(-9,-19,18,7,p.swim);

      rect(-9,-20,18,22,p.swim);

    oval(s+2,-s*.4,1,1,"#20313b");

function drawSnake(s){
  ctx.save();
  ctx.translate(s.x,s.y);
  ctx.rotate(s.angle);

  ctx.lineCap="round";
  ctx.lineWidth=5;
  ctx.strokeStyle=s.color;
  ctx.beginPath();

  for(let i=0;i<=14;i++){
    const x=i*s.length/14;
    const y=Math.sin(time*2+s.phase+i*.5)*5;

    i?ctx.lineTo(x,y):ctx.moveTo(x,y);
  }

  ctx.stroke();

  const y=Math.sin(time*2+s.phase+7)*5;

  oval(s.length,y,5,4,s.color);
  oval(s.length+2,y-2,1,1,"#ecd685");

  ctx.restore();
}

    round(x,y,w,h,4,"#c9d1ca");
    rect(x+8,y+4,w-16,10,"#7ea4b4");
    rect(x+12,y+18,18,10,"#445f6a");
    return;
  }

  if(type==="notice"){
    rect(x,y,w,h,"#9c7b51");
    rect(x+7,y+5,20,24,"#eee0b6");
    rect(x+36,y+7,24,20,"#b9d0c9");
    return;
  }

  round(x+4,y+5,w,h,3,"#0003");
  round(
    x,y,w,h,3,
    type==="computer"?
    "#617482":"#896746"
  );
  rect(
    x+6,y+6,w-12,h-12,
    type==="computer"?
    "#9baab0":"#c7a775"
  );

  if(type==="computer"){
    for(const dx of [17,82]){
      round(x+dx,y+8,44,25,3,"#263640");
      rect(x+dx+4,y+11,36,17,"#4c8599");

      line(
        x+dx+7,y+16,
        x+dx+28,y+16,"#c2e5d1",2
      );
      line(
        x+dx+10,y+22,
        x+dx+33,y+22,"#e0d08e",2
      );

      rect(x+dx+18,y+33,6,6,"#3c4d57");
      rect(x+dx,y+43,43,9,"#d0d2c7");
      oval(x+dx+49,y+47,3,5,"#d3d7ce");
    }
  }else{
    rect(x+18,y+12,35,25,"#eee6d1");
    line(x+35,y+12,x+35,y+37,"#b9ae94");

    for(let i=0;i<3;i++){
      line(
        x+21,y+18+i*5,
        x+30,y+18+i*5,"#99a5a4"
      );
    }

    line(x+67,y+15,x+72,y+37,"#d6b24b",3);
  }
}

/* ================= NOMES E BALÕES ================= */

function nametag(p){
  if(!p.name)return;

  const offset=
    p===wagner?185:
    p===jean?78:
    p===linux?43:
    p===nicolas?60:57;

  const x=p.x,y=p.y-offset;

  ctx.save();
  ctx.font='700 13px "Segoe UI",Arial';

  const w=ctx.measureText(p.name).width+22;

  round(x-w/2,y-13,w,26,7,"#142232ed");

  if(p.special){
    ctx.save();
    ctx.beginPath();
    ctx.roundRect(x-w/2,y-13,w,26,7);
    ctx.clip();

    RAINBOW.forEach((c,i)=>
      rect(x-w/2+i*w/6,y+9,w/6+1,4,c)
    );

    ctx.restore();
  }

  text(p.name,x,y,13);
  ctx.restore();
}

function speechBubble(p){
  if(
    !p.speech||p.speechTimer<=0||
    !visible(p.x,p.y,0)
  )return;

  ctx.save();
  ctx.font='600 13px "Segoe UI",Arial';

  const lines=[];
  let current="";
  const maxWidth=Math.max(
    90,Math.min(210,width-40)
  );

  for(const word of p.speech.split(" ")){
    const test=current?current+" "+word:word;

    if(
      current&&
      ctx.measureText(test).width>maxWidth
    ){
      lines.push(current);
      current=word;
    }else{
      current=test;
    }
  }

  if(current)lines.push(current);

  const w=Math.max(
    ...lines.map(s=>ctx.measureText(s).width)
  )+24;
  const h=lines.length*18+18;
  const student=p.key==="alunos";

  let cx=p.x;

  if(student){
    cx+=p.x<wagner.x?-100:100;
  }

  cx=clamp(
    cx,camera.x+w/2+8,
    camera.x+width-w/2-8
  );

  let bottom=p.y-(p===jean?112:90);

  if(student&&p.y>wagner.y){
    bottom=p.y+h+35;
  }

  const top=Math.max(camera.y+8,bottom-h);

  round(cx-w/2+3,top+4,w,h,10,"#0003");
  round(cx-w/2,top,w,h,10,"#f7f2e5");

  if(student&&p.y>wagner.y){
    poly([
      [cx-6,top+1],
      [cx+6,top+1],
      [p.x,p.y+10]
    ],"#f7f2e5");
  }else{
    poly([
      [cx-6,top+h-1],
      [cx+6,top+h-1],
      [p.x,p.y-(p===jean?94:68)]
    ],"#f7f2e5");
  }

  lines.forEach((s,i)=>
    text(s,cx,top+18+i*18,13,"#2c3c44")
  );

  ctx.restore();
}

function gps(
  target,label,color,margin,rainbow=false
){
  const sx=target.x-camera.x;
  const sy=target.y-camera.y;

  if(
    sx>-20&&sx<width+20&&
    sy>-20&&sy<height+45
  )return;

  const dx=sx-width/2;
  const dy=sy-height/2;
  const m=Math.min(margin,width*.3,height*.3);

  const hw=Math.max(1,width/2-m);
  const hh=Math.max(1,height/2-m);

  const factor=1/Math.max(
    Math.abs(dx)/hw,Math.abs(dy)/hh
  );

  const x=width/2+dx*factor;
  const y=height/2+dy*factor;
  const a=Math.atan2(dy,dx);

  oval(x,y,25,25,"#142b3eea");

  if(rainbow){
    RAINBOW.forEach((c,i)=>{
      ctx.beginPath();
      ctx.arc(
        x,y,23,
        i*Math.PI/3,(i+1)*Math.PI/3
      );
      ctx.strokeStyle=c;
      ctx.lineWidth=4;
      ctx.stroke();
    });
  }else{
    ctx.beginPath();
    ctx.arc(x,y,23,0,Math.PI*2);
    ctx.strokeStyle=color;
    ctx.lineWidth=3;
    ctx.stroke();
  }

  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(a);
  poly([[36,0],[25,-7],[25,7]],color);
  ctx.restore();

  text(
    label==="Fatec"?"Fatec":label[0],
    x,y,label==="Fatec"?12:19
  );

  const caption=label==="Fatec"?"":
    `${label} · ${
      Math.round(distance(player,target)/10)
    } m`;

  if(caption){
    ctx.save();
    ctx.font='600 11px "Segoe UI",Arial';

    const w=ctx.measureText(caption).width+16;

    const xx=clamp(
      x-Math.cos(a)*80,
      w/2+6,width-w/2-6
    );
    const yy=clamp(
      y-Math.sin(a)*48,14,height-14
    );

    round(
      xx-w/2,yy-11,w,22,6,"#142b3eea"
    );
    text(caption,xx,yy,11,"#eee1bd");
    ctx.restore();
  }
}

/* ================= ATUALIZAÇÃO ================= */

function update(dt){
  time+=dt;
  updatePlayer(dt);

  people.forEach(p=>followCircuit(p,dt));
  vehicles.forEach(p=>followCircuit(p,dt));

  followCircuit(nicolas,dt);
  moveTraveler(felipe,dt);
  moveTraveler(zannetu,dt);
  followCircuit(evangelista,dt);

  updatePenguin(dt);

  [felipe,zannetu,evangelista,joao].forEach(p=>
    updateSpeech(p,dt)
  );

  if(inside){
    updateSpeech(jean,dt);
    updateSpeech(psicologa,dt);
  }

  updateStudents(dt);
  updateBeach(dt);
  updateAnimals(dt);
}

/* ================= RENDERIZAÇÃO ================= */

function draw(){
  const world=inside?INTERIOR:WORLD;

  camera.x=clamp(
    player.x-width/2,
    0,Math.max(0,world.w-width)
  );
  camera.y=clamp(
    player.y-height/2,
    0,Math.max(0,world.h-height)
  );

  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,width,height);

  rect(
    0,0,width,height,
    inside?"#2b3944":"#697f4f"
  );

  ctx.save();
  ctx.translate(-camera.x,-camera.y);

  const items=[];
  const add=(y,draw)=>items.push({y,draw});

  if(inside){
    drawInteriorFloor();

    insideWalls.filter(visibleBox).forEach(b=>{
      add(b.y+b.h,()=>{
        rect(b.x+2,b.y+3,b.w,b.h,"#0002");
        rect(b.x,b.y,b.w,b.h,"#8d806c");
        rect(b.x,b.y,b.w,4,"#c1b59a");
      });
    });

    furniture.filter(visibleBox).forEach(p=>{
      add(p.y+p.h,()=>drawFurniture(p));
    });

    if(visible(jean.x,jean.y)){
      add(jean.y+8,drawJean);
    }

    jeanStudents.forEach(p=>{
      if(visible(p.x,p.y)){
        add(p.y+8,()=>drawSadStudent(p));
      }
    });

    // A Psicóloga é desenhada por último,
    // para nunca ficar atrás do palco.
    if(visible(psicologa.x,psicologa.y)){
      add(999999,()=>drawHuman(psicologa));
    }

    const currentRoom=rooms.find(r=>
      player.x>r.x&&player.x<r.x+r.w&&
      player.y>r.y&&player.y<r.y+r.h
    );

    locationText.textContent=
      currentRoom?
      `Interior da Fatec · ${currentRoom.name}`:
      "Interior da Fatec · Corredores";
  }else{
    drawGround();
    drawCampus();

    buildings.filter(b=>
      !b.solid&&visibleBox(b)
    ).forEach(drawBuilding);

    buildings.filter(b=>
      b.solid&&visibleBox(b)
    ).forEach(b=>
      add(b.y+b.h,()=>drawBuilding(b))
    );

    walls.filter(visibleBox).forEach(b=>
      add(b.y+b.h,()=>drawCampusWall(b))
    );

    trees.forEach(t=>{
      if(visible(t.x,t.y)){
        add(t.y,()=>drawTree(t.x,t.y,t.s));
      }
    });

    animals.forEach(a=>{
      if(visible(a.x,a.y)){
        add(a.y+7,()=>drawAnimal(a));
      }
    });

    snakes.forEach(s=>{
      if(visible(s.x,s.y)){
        add(s.y+5,()=>drawSnake(s));
      }
    });

    vehicles.forEach(v=>{
      if(visible(v.x,v.y)){
        add(v.y+10,()=>drawVehicle(v));
      }
    });

    if(visible(nicolas.x,nicolas.y)){
      add(
        nicolas.y+10,
        ()=>drawBike(nicolas)
      );
    }

    [
      ...people,...beachPeople,
      felipe,zannetu,evangelista,joao,
      ...students
    ].forEach(p=>{
      if(visible(p.x,p.y)){
        add(p.y+8,()=>drawHuman(p));
      }
    });

    if(visible(linux.x,linux.y)){
      add(linux.y+8,drawPenguin);
    }

    if(visible(wagner.x,wagner.y,220)){
      add(wagner.y+8,drawWagner);
    }

    if(visible(tia.x,tia.y,180)){
      add(tia.y+8,()=>drawHuman(tia));
    }

    customers.forEach(p=>{
      if(visible(p.x,p.y)){
        add(p.y+8,()=>drawHuman(p));
      }
    });

    locationText.textContent=
      player.y>4050?"Floresta":
      player.y<1280?
        (
          inCampus(player.x,player.y)?
          "Campus Fatec":
          player.x>ESPELINHOS.x-100&&
          player.x<ESPELINHOS.x+ESPELINHOS.w+100&&
          player.y>ESPELINHOS.y-100&&
          player.y<ESPELINHOS.y+ESPELINHOS.h+100?
          "Espetinhos":"Praia"
        ):
      "Cidade";
  }

  add(player.y+8,()=>drawHuman(player));

  items.sort((a,b)=>a.y-b.y);
  items.forEach(item=>item.draw());

  nametag(player);

  if(inside){
    [jean,psicologa].forEach(p=>{
      if(visible(p.x,p.y,0))nametag(p);
      speechBubble(p);
    });
  }else{
    [
      felipe,zannetu,linux,
      evangelista,joao,wagner,nicolas
    ].forEach(p=>{
      if(visible(p.x,p.y,0))nametag(p);
    });

    if(visible(tia.x,tia.y,0)){
      nametag({
        name:"Tia",
        x:tia.x,
        y:tia.y-30
      });
    }

    [
      felipe,zannetu,evangelista,joao,
      ...students
    ].forEach(speechBubble);
  }

  ctx.restore();

  if(!inside){
    gps(felipe,"Felipe","#efd18d",44,true);
    gps(zannetu,"Zannetu","#e4bd79",83);

    const seen=
      FATEC.x+FATEC.w>camera.x&&
      FATEC.x<camera.x+width&&
      FATEC.y+FATEC.h>camera.y&&
      FATEC.y<camera.y+height;

    if(!seen){
      gps(
        {x:2800,y:685},
        "Fatec","#8ac9dc",125
      );
    }
  }
}

/* ================= TELA E CONTROLES ================= */

function resize(){
  width=Math.max(1,window.innerWidth);
  height=Math.max(1,window.innerHeight);
  dpr=Math.min(window.devicePixelRatio||1,2);

  canvas.width=Math.round(width*dpr);
  canvas.height=Math.round(height*dpr);
}

window.addEventListener("resize",resize);

window.addEventListener("keydown",e=>{
  const key=e.key.toLowerCase();

  if([
    "w","a","s","d",
    "arrowup","arrowdown",
    "arrowleft","arrowright",
    "shift","e"
  ].includes(key)){
    e.preventDefault();
    keys.add(key);
  }

  if(key==="e"&&!e.repeat){
    interactRequested=true;
  }
});

window.addEventListener("keyup",e=>{
  keys.delete(e.key.toLowerCase());
});

function resetInput(){
  keys.clear();
  interactRequested=false;
  lastTime=0;
}

window.addEventListener("blur",resetInput);
document.addEventListener("visibilitychange",resetInput);

function loop(timestamp){
  const dt=lastTime?
    Math.min((timestamp-lastTime)/1000,.04):0;

  lastTime=timestamp;

  update(dt);
  draw();

  requestAnimationFrame(loop);
}

/* ================= INICIALIZAÇÃO ================= */

createCity();
createInterior();
createPeople();
createIndoorCharacters();
createTia();
createTraffic();
createAnimals();
resize();

requestAnimationFrame(loop);
</script>
